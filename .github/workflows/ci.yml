name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,terminal]'
      - run: python -m pytest -q -W error::RuntimeWarning -p no:cacheprovider
        env:
          PYNTERACT_CONFIG_DIR: ${{ runner.temp }}/pynteract-config

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build 'asttokens>=2.4'
      # Default build creates the wheel from the sdist, testing both formats.
      - run: python -m build
      # No source-tree import and no terminal extra required for embedding.
      - run: python tests/wheel_smoke.py dist/*.whl
